name: Verify POTATO V5.3

on:
  push:
    branches:
      - verify-v5.1
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Create corrected V5.3 source from V5.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir build-src
          unzip -q POTATO-JARVIS-V5.1-BUILDABLE.zip -d build-src
          OLD="$(dirname "$(find build-src -name settings.gradle.kts -print -quit)")"
          test -n "$OLD"
          NEW="build-src/POTATO-JARVIS-V5.3"
          mv "$OLD" "$NEW"

          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-compose:2.9.7/androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2/' "$NEW/android/build.gradle.kts"
          sed -i 's/androidx.lifecycle:lifecycle-runtime-compose:2.9.7/androidx.lifecycle:lifecycle-runtime-compose:2.9.2/' "$NEW/android/build.gradle.kts"
          sed -i 's/versionCode = 51/versionCode = 53/' "$NEW/android/build.gradle.kts"
          sed -i 's/versionName = "5.1"/versionName = "5.3"/' "$NEW/android/build.gradle.kts"
          sed -i 's/\\"5.1\\"/\\"5.3\\"/g' "$NEW/android/build.gradle.kts"
          printf '5.3\n' > "$NEW/VERSION"
          sed -i 's/POTATO-JARVIS-V5.1/POTATO-JARVIS-V5.3/g' "$NEW/settings.gradle.kts" "$NEW/README.md"
          sed -i 's/POTATO V5.1 API surface/POTATO V5.3 API surface/' "$NEW/docs/API.md"
          sed -i 's/VERSION = "5.1"/VERSION = "5.3"/' "$NEW/backend/main.py"
          sed -i 's/== "5.1"/== "5.3"/' "$NEW/backend/tests/test_main.py"

          python - <<'PY'
          from pathlib import Path
          root = Path("build-src/POTATO-JARVIS-V5.3")

          p = root / "android/build.gradle.kts"
          s = p.read_text()
          anchor = "    buildFeatures {\n        compose = true\n        buildConfig = true\n    }\n"
          replacement = "    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n    kotlinOptions {\n        jvmTarget = \"17\"\n    }\n\n" + anchor
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              if anchor not in s:
                  raise SystemExit("buildFeatures anchor not found")
              s = s.replace(anchor, replacement, 1)
          p.write_text(s)

          p = root / "android/src/main/java/com/potato/jarvis/MainActivity.kt"
          s = p.read_text()
          s = s.replace("import androidx.activity.compose.rememberLauncherForActivityResult\n", "import androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.compose.setContent\n")
          s = s.replace("import androidx.activity.result.ActivityResultLauncher\n", "import androidx.activity.result.ActivityResultLauncher\nimport androidx.activity.result.PickVisualMediaRequest\n")
          s = s.replace("import androidx.compose.foundation.layout.weight\n", "")
          s = s.replace("import androidx.compose.material3.CircularProgressIndicator\n", "import androidx.compose.material3.CircularProgressIndicator\nimport androidx.compose.material3.ExperimentalMaterial3Api\n")
          s = s.replace("@Composable\nfun PotatoApp(vm: JarvisViewModel) {", "@OptIn(ExperimentalMaterial3Api::class)\n@Composable\nfun PotatoApp(vm: JarvisViewModel) {", 1)
          s = s.replace("    PotatoTheme {\n        if (state.setupRequired) {\n            SetupScreen(vm, state)\n            return@MaterialTheme\n        }\n        Scaffold(", "    PotatoTheme {\n        if (state.setupRequired) {\n            SetupScreen(vm, state)\n        } else {\n            Scaffold(", 1)
          close_old = "            }\n        }\n    }\n}\n\n@Composable\nprivate fun NotificationScreen"
          close_new = "            }\n        }\n        }\n    }\n}\n\n@Composable\nprivate fun NotificationScreen"
          if close_old not in s:
              raise SystemExit("PotatoApp close anchor not found")
          s = s.replace(close_old, close_new, 1)
          s = s.replace("ActivityResultContracts.PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.ImageOnly)", "PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.ImageOnly)")
          upload_old = "                vm.uploadFile(name, mime, length) {\n                    context.contentResolver.openInputStream(uri) ?: error(\"Unable to open selected file\")\n                }"
          upload_new = "                vm.uploadFile(\n                    name = name,\n                    mime = mime,\n                    length = length,\n                    openStream = {\n                        context.contentResolver.openInputStream(uri)\n                            ?: error(\"Unable to open selected file\")\n                    },\n                )"
          if upload_old not in s:
              raise SystemExit("upload call anchor not found")
          s = s.replace(upload_old, upload_new, 1)
          p.write_text(s)

          p = root / "android/src/main/java/com/potato/jarvis/ui/JarvisViewModel.kt"
          s = p.read_text()
          old = "        runCatching { api.biometricChallenge(id).optString(\"challenge\") }\n            .filter { it.isNotBlank() }\n            .onSuccess { challenge -> withContext(Dispatchers.Main) { onReady(challenge) } }\n            .onFailure { error -> withContext(Dispatchers.Main) { onFailure(friendlyError(error)) } }"
          new = "        runCatching {\n            api.biometricChallenge(id).optString(\"challenge\")\n                .takeIf { it.isNotBlank() }\n                ?: error(\"Biometric challenge was empty\")\n        }\n            .onSuccess { challenge -> withContext(Dispatchers.Main) { onReady(challenge) } }\n            .onFailure { error -> withContext(Dispatchers.Main) { onFailure(friendlyError(error)) } }"
          if old not in s:
              raise SystemExit("biometric anchor not found")
          p.write_text(s.replace(old, new, 1))

          p = root / "android/src/main/java/com/potato/jarvis/device/DeviceContext.kt"
          s = p.read_text()
          s = s.replace("import com.potato.jarvis.BuildConfig\n", "import com.potato.jarvis.BuildConfig\nimport com.potato.jarvis.core.DeviceContextSnapshot\n")
          start = s.index("    data class Snapshot(")
          end = s.index("\n\n    fun snapshot", start)
          s = s[:start] + s[end+2:]
          s = s.replace("fun snapshot(includeCalendar: Boolean, includeContacts: Boolean, includeLocation: Boolean): Snapshot {", "fun snapshot(includeCalendar: Boolean, includeContacts: Boolean, includeLocation: Boolean): DeviceContextSnapshot {")
          s = s.replace("return Snapshot(", "return DeviceContextSnapshot(", 1)
          p.write_text(s)

          p = root / "android/src/main/java/com/potato/jarvis/voice/VoiceManager.kt"
          s = p.read_text()
          old = "        stopSpeaking()\n        recognizer.cancel()\n        val intent"
          new = "        stopSpeaking()\n        val activeRecognizer = recognizer ?: run {\n            onError(\"Speech recognition is unavailable on this device\")\n            onState(State.ERROR)\n            return\n        }\n        activeRecognizer.cancel()\n        val intent"
          if old not in s:
              raise SystemExit("recognizer anchor not found")
          s = s.replace(old, new, 1)
          s = s.replace("runCatching { recognizer.startListening(intent) }", "runCatching { activeRecognizer.startListening(intent) }", 1)
          p.write_text(s)
          PY

          cat > "$NEW/android/src/debug/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <application
                  android:usesCleartextTraffic="true"
                  tools:replace="android:usesCleartextTraffic" />
          </manifest>
          EOF

          cat > "$NEW/android/src/main/res/values/strings.xml" <<'EOF'
          <resources>
              <string name="potato_accessibility_service_description">POTATO assistive service (reserved; no cross-app control)</string>
          </resources>
          EOF
          sed -i 's#android:description="POTATO assistive service (reserved; no cross-app control)"#android:description="@string/potato_accessibility_service_description"#' "$NEW/android/src/main/res/xml/accessibility_service_config.xml"
          echo "PROJECT_ROOT=$NEW" >> "$GITHUB_ENV"

      - name: Verify V5.3 source state
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          test "$(tr -d '\r\n' < VERSION)" = "5.3"
          grep -q 'versionCode = 53' android/build.gradle.kts
          grep -q 'versionName = "5.3"' android/build.gradle.kts
          grep -q 'VERSION = "5.3"' backend/main.py
          grep -q 'lifecycle-viewmodel-compose:2.9.2' android/build.gradle.kts
          grep -q 'lifecycle-runtime-compose:2.9.2' android/build.gradle.kts
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' android/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' android/build.gradle.kts
          grep -q 'jvmTarget = "17"' android/build.gradle.kts
          grep -q 'import androidx.activity.compose.setContent' android/src/main/java/com/potato/jarvis/MainActivity.kt
          grep -q 'import androidx.activity.result.PickVisualMediaRequest' android/src/main/java/com/potato/jarvis/MainActivity.kt
          grep -q 'DeviceContextSnapshot' android/src/main/java/com/potato/jarvis/device/DeviceContext.kt
          ! grep -q 'androidx.lifecycle:.*:2.9.7' android/build.gradle.kts

      - name: Backend dependencies
        run: python -m pip install -r "$PROJECT_ROOT/backend/requirements.txt"

      - name: Backend compile and tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python -m compileall -q backend
          python -m pytest -q backend/tests

      - name: Verify Gradle bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          chmod +x gradlew scripts/*.sh backend/run.sh
          ./scripts/verify_gradle_wrapper.sh

      - name: Verify Android resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew :android:processDebugResources --no-daemon

      - name: Android compile and lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew :android:assembleDebug :android:lint --no-daemon

      - name: Package corrected V5.3 source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd build-src
          zip -qr POTATO-JARVIS-FINAL-V5.3.zip POTATO-JARVIS-V5.3
          sha256sum POTATO-JARVIS-FINAL-V5.3.zip

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5.3-debug-apk
          path: ${{ env.PROJECT_ROOT }}/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload corrected V5.3 source archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: POTATO-JARVIS-FINAL-V5.3
          path: build-src/POTATO-JARVIS-FINAL-V5.3.zip
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5.3-lint-reports
          path: |
            ${{ env.PROJECT_ROOT }}/android/build/reports/
            ${{ env.PROJECT_ROOT }}/android/build/intermediates/lint*/
          if-no-files-found: ignore
