name: Verify POTATO V5.2

on:
  push:
    branches:
      - verify-v5.1
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Create corrected V5.2 source from V5.1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir build-src
          unzip -q POTATO-JARVIS-V5.1-BUILDABLE.zip -d build-src
          OLD="$(dirname "$(find build-src -name settings.gradle.kts -print -quit)")"
          test -n "$OLD"
          NEW="build-src/POTATO-JARVIS-V5.2"
          mv "$OLD" "$NEW"

          sed -i 's/androidx.lifecycle:lifecycle-viewmodel-compose:2.9.7/androidx.lifecycle:lifecycle-viewmodel-compose:2.9.2/' "$NEW/android/build.gradle.kts"
          sed -i 's/androidx.lifecycle:lifecycle-runtime-compose:2.9.7/androidx.lifecycle:lifecycle-runtime-compose:2.9.2/' "$NEW/android/build.gradle.kts"
          sed -i 's/versionCode = 51/versionCode = 52/' "$NEW/android/build.gradle.kts"
          sed -i 's/versionName = "5.1"/versionName = "5.2"/' "$NEW/android/build.gradle.kts"
          sed -i 's/\\"5.1\\"/\\"5.2\\"/g' "$NEW/android/build.gradle.kts"
          printf '5.2\n' > "$NEW/VERSION"
          sed -i 's/POTATO-JARVIS-V5.1/POTATO-JARVIS-V5.2/g' "$NEW/settings.gradle.kts" "$NEW/README.md"
          sed -i 's/POTATO V5.1 API surface/POTATO V5.2 API surface/' "$NEW/docs/API.md"
          sed -i 's/VERSION = "5.1"/VERSION = "5.2"/' "$NEW/backend/main.py"
          sed -i 's/== "5.1"/== "5.2"/' "$NEW/backend/tests/test_main.py"

          python - <<'PY'
          from pathlib import Path
          p = Path("build-src/POTATO-JARVIS-V5.2/android/build.gradle.kts")
          s = p.read_text()
          anchor = "    buildFeatures {\n        compose = true\n        buildConfig = true\n    }\n"
          replacement = "    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n\n    kotlinOptions {\n        jvmTarget = \"17\"\n    }\n\n" + anchor
          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              if anchor not in s:
                  raise SystemExit("buildFeatures anchor not found")
              s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY

          cat > "$NEW/android/src/debug/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
              <application
                  android:usesCleartextTraffic="true"
                  tools:replace="android:usesCleartextTraffic" />
          </manifest>
          EOF

          cat > "$NEW/android/src/main/res/values/strings.xml" <<'EOF'
          <resources>
              <string name="potato_accessibility_service_description">POTATO assistive service (reserved; no cross-app control)</string>
          </resources>
          EOF

          sed -i 's#android:description="POTATO assistive service (reserved; no cross-app control)"#android:description="@string/potato_accessibility_service_description"#' "$NEW/android/src/main/res/xml/accessibility_service_config.xml"

          echo "PROJECT_ROOT=$NEW" >> "$GITHUB_ENV"

      - name: Verify V5.2 source state
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          test "$(tr -d '\r\n' < VERSION)" = "5.2"
          grep -q 'versionCode = 52' android/build.gradle.kts
          grep -q 'versionName = "5.2"' android/build.gradle.kts
          grep -q 'VERSION = "5.2"' backend/main.py
          grep -q 'lifecycle-viewmodel-compose:2.9.2' android/build.gradle.kts
          grep -q 'lifecycle-runtime-compose:2.9.2' android/build.gradle.kts
          grep -q 'sourceCompatibility = JavaVersion.VERSION_17' android/build.gradle.kts
          grep -q 'targetCompatibility = JavaVersion.VERSION_17' android/build.gradle.kts
          grep -q 'jvmTarget = "17"' android/build.gradle.kts
          grep -q 'tools:replace="android:usesCleartextTraffic"' android/src/debug/AndroidManifest.xml
          grep -q 'android:description="@string/potato_accessibility_service_description"' android/src/main/res/xml/accessibility_service_config.xml
          grep -q 'name="potato_accessibility_service_description"' android/src/main/res/values/strings.xml
          ! grep -q 'androidx.lifecycle:.*:2.9.7' android/build.gradle.kts

      - name: Backend dependencies
        run: python -m pip install -r "$PROJECT_ROOT/backend/requirements.txt"

      - name: Backend compile and tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python -m compileall -q backend
          python -m pytest -q backend/tests

      - name: Verify Gradle bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          chmod +x gradlew scripts/*.sh backend/run.sh
          ./scripts/verify_gradle_wrapper.sh

      - name: Verify Android resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew :android:processDebugResources --no-daemon

      - name: Android compile and lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew :android:assembleDebug :android:lint --no-daemon

      - name: Package corrected V5.2 source
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd build-src
          zip -qr POTATO-JARVIS-FINAL-V5.2.zip POTATO-JARVIS-V5.2
          sha256sum POTATO-JARVIS-FINAL-V5.2.zip

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5.2-debug-apk
          path: ${{ env.PROJECT_ROOT }}/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload corrected V5.2 source archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: POTATO-JARVIS-FINAL-V5.2
          path: build-src/POTATO-JARVIS-FINAL-V5.2.zip
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5.2-lint-reports
          path: |
            ${{ env.PROJECT_ROOT }}/android/build/reports/
            ${{ env.PROJECT_ROOT }}/android/build/intermediates/lint*/
          if-no-files-found: ignore
