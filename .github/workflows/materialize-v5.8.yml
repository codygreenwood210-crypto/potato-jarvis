name: Materialize POTATO V5.8 Final Source

on:
  push:
    branches: [potato-v5.8-final]
    paths:
      - '.potato-v58/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: potato-v5.8-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout V5.8 transfer branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: potato-v5.8-final
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Verify and materialize exact V5.8 overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '5.7'
          test -f .potato-v58/READY
          test "$(find .potato-v58 -maxdepth 1 -type f -name 'payload.b64.*' | wc -l)" -eq 9
          cat .potato-v58/payload.b64.* > /tmp/potato-v58.b64
          base64 --decode /tmp/potato-v58.b64 > /tmp/potato-v58.tar.xz
          echo '6e4d60f0c4fbdf80a4ca10120c6d999eab1d41c488c0fe737f3c253323bef2e6  /tmp/potato-v58.tar.xz' | sha256sum -c -
          tar -tJf /tmp/potato-v58.tar.xz >/tmp/potato-v58-files.txt
          test "$(grep -c '^' /tmp/potato-v58-files.txt)" -ge 12
          tar -xJf /tmp/potato-v58.tar.xz -C .
          rm -f SOURCE_MANIFEST.sha256
          test "$(cat VERSION)" = '5.8'
          grep -F 'versionCode = 58' android/build.gradle.kts
          grep -F 'versionName = "5.8"' android/build.gradle.kts
          grep -F 'Color(0xFF10A37F)' android/src/main/java/com/potato/jarvis/ui/PotatoTheme.kt
          grep -F 'Color(0xFF19C37D)' android/src/main/java/com/potato/jarvis/ui/PotatoTheme.kt
          test -s .github/workflows/verify-v5.8-final.yml

      - name: Install backend dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Regression and source-integrity gate
        shell: bash
        env:
          POTATO_ENV: test
        run: |
          set -euo pipefail
          python -m compileall -q backend scripts
          python scripts/scan_secrets.py .
          PYTHONPATH=. python -m pytest -q backend/tests
          chmod +x gradlew scripts/*.sh backend/run.sh
          ./scripts/verify_gradle_wrapper.sh

      - name: Commit only materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .potato-v58
          rm -f .github/workflows/materialize-v5.8.yml
          git config user.name 'POTATO Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          test "$(cat VERSION)" = '5.8'
          git commit -m 'Materialize POTATO V5.8 root-cause repaired source'
          git push origin HEAD:potato-v5.8-final
