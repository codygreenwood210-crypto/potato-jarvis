name: POTATO V5.6 Verify Build and Emulator Smoke

on:
  push:
    branches: [potato-v5.6-repair]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct and unpack V5.6 source
        shell: bash
        run: |
          set -euo pipefail
          cat .potato-v56/source.b64.* | base64 -d > /tmp/POTATO-JARVIS-V5.6-CI.tar.xz
          rm -rf work
          mkdir work
          tar -xJf /tmp/POTATO-JARVIS-V5.6-CI.tar.xz -C work
          test -f work/POTATO-JARVIS-V5.6-CI/settings.gradle.kts
          test -f work/POTATO-JARVIS-V5.6-CI/gradle/wrapper/gradle-wrapper.jar

      - name: Backend compile and regression tests
        working-directory: work/POTATO-JARVIS-V5.6-CI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m compileall -q backend
          PYTHONPATH=. python -m pytest -q backend/tests/test_main.py

      - name: Verify Gradle wrapper
        working-directory: work/POTATO-JARVIS-V5.6-CI
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/*.sh backend/run.sh
          ./scripts/verify_gradle_wrapper.sh

      - name: Ensure Android SDK 36 and emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Android tests lint and package
        working-directory: work/POTATO-JARVIS-V5.6-CI
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace \
            :android:testDebugUnitTest \
            :android:lintDebug \
            :android:assembleDebug \
            :android:bundleRelease
          test -s android/build/outputs/apk/debug/android-debug.apk
          test -s android/build/outputs/bundle/release/android-release.aab

      - name: Start real POTATO backend for emulator smoke test
        working-directory: work/POTATO-JARVIS-V5.6-CI
        shell: bash
        run: |
          set -euo pipefail
          . .venv-ci/bin/activate
          POTATO_ENV=development POTATO_ALLOW_ANONYMOUS=true POTATO_DB=/tmp/potato-v56-ci.db \
            python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 >/tmp/potato-backend.log 2>&1 &
          echo $! >/tmp/potato-backend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/v1/health >/tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          grep -q '"version":"5.6"' /tmp/health.json

      - name: Boot emulator install APK and verify GUI
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          echo no | avdmanager create avd --force --name potato-ci --package "system-images;android-35;google_apis;x86_64" --device "pixel_6"
          "$ANDROID_HOME/emulator/emulator" -avd potato-ci -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >/tmp/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          APK="$GITHUB_WORKSPACE/work/POTATO-JARVIS-V5.6-CI/android/build/outputs/apk/debug/android-debug.apk"
          adb install -r "$APK"
          adb shell am start -W -n com.potato.jarvis/.MainActivity | tee /tmp/am-start.txt
          grep -q 'Status: ok' /tmp/am-start.txt
          sleep 3

          dump_ui() {
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
          }
          tap_text() {
            local needle="$1"
            dump_ui
            local xy
            xy=$(python3 - "$needle" <<'PY'
import re, sys, xml.etree.ElementTree as ET
needle=sys.argv[1].lower()
root=ET.parse('/tmp/window.xml').getroot()
for n in root.iter('node'):
    text=(n.attrib.get('text','')+' '+n.attrib.get('content-desc','')).lower()
    if needle in text:
        m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
        if m:
            a,b,c,d=map(int,m.groups())
            print((a+c)//2, (b+d)//2)
            raise SystemExit(0)
raise SystemExit(2)
PY
            )
            adb shell input tap $xy
          }

          dump_ui
          grep -Eq 'Optional Accessibility context|POTATO' /tmp/window.xml
          tap_text "Accept"
          sleep 2
          dump_ui
          grep -q 'Test &amp; Connect\|Test & Connect' /tmp/window.xml || grep -q 'Connect your AI assistant' /tmp/window.xml
          tap_text "Test & Connect"
          sleep 5
          dump_ui
          grep -Eq 'New chat|Talk to POTATO|online' /tmp/window.xml
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/POTATO-V5.6-emulator.png"
          cp "$APK" "$GITHUB_WORKSPACE/POTATO-JARVIS-V5.6-debug.apk"
          cp "$GITHUB_WORKSPACE/work/POTATO-JARVIS-V5.6-CI/android/build/outputs/bundle/release/android-release.aab" "$GITHUB_WORKSPACE/POTATO-JARVIS-V5.6-release.aab"

      - name: Record hashes and evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum POTATO-JARVIS-V5.6-debug.apk POTATO-JARVIS-V5.6-release.aab POTATO-V5.6-emulator.png | tee POTATO-V5.6-SHA256SUMS.txt
          cp /tmp/window.xml POTATO-V5.6-ui.xml
          cp /tmp/health.json POTATO-V5.6-health.json

      - name: Publish verified artifacts to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "POTATO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add POTATO-JARVIS-V5.6-debug.apk POTATO-JARVIS-V5.6-release.aab POTATO-V5.6-emulator.png POTATO-V5.6-SHA256SUMS.txt POTATO-V5.6-ui.xml POTATO-V5.6-health.json
          if git diff --cached --quiet; then
            echo "Verified artifacts already current"
          else
            git commit -m "build: publish verified POTATO V5.6 artifacts [skip ci]"
            git push origin HEAD:potato-v5.6-repair
          fi
