name: Verify POTATO UI Reference

on:
  push:
    branches: [potato-v5.8-ui-reference]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: potato-ui-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout UI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Source integrity
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = '5.8'
          chmod +x gradlew scripts/*.sh scripts/*.py backend/run.sh
          python -m compileall -q backend scripts
          python scripts/scan_secrets.py .
          ./scripts/verify_gradle_wrapper.sh

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Backend regression tests
        env:
          POTATO_ENV: test
        run: python -m pytest -q backend/tests

      - name: Android unit tests
        run: ./gradlew :android:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: |
          set -euo pipefail
          ./gradlew :android:assembleDebug --no-daemon --stacktrace
          test -s android/build/outputs/apk/debug/android-debug.apk
          unzip -t android/build/outputs/apk/debug/android-debug.apk >/dev/null

      - name: Android lint
        run: ./gradlew :android:lint --no-daemon --max-workers=1 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' --stacktrace

      - name: Install emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 6 -type f -name sdkmanager 2>/dev/null | sort | tail -1)"
          AVDMANAGER="$(find "$SDK_ROOT" -maxdepth 6 -type f -name avdmanager 2>/dev/null | sort | tail -1)"
          ADB="$SDK_ROOT/platform-tools/adb"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "ADB=$ADB" >> "$GITHUB_ENV"
          echo "EMULATOR=$SDK_ROOT/emulator/emulator" >> "$GITHUB_ENV"

      - name: Start local POTATO backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/potato-home"
          POTATO_ENV=development POTATO_ALLOW_ANONYMOUS=true POTATO_DB="$RUNNER_TEMP/potato-ui.db" POTATO_HOME="$RUNNER_TEMP/potato-home" \
            python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 >"$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/v1/health >"$RUNNER_TEMP/health.json" && break
            sleep 1
          done
          grep -q '"version":"5.8"' "$RUNNER_TEMP/health.json"

      - name: Seed disposable reference-screen tasks
        shell: bash
        run: |
          set -euo pipefail
          python scripts/seed_ui_reference_backend.py

      - name: Boot emulator and capture POTATO UI
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd --force --name potato-ui --package "system-images;android-35;google_apis;x86_64" --device "pixel_tablet"
          "$EMULATOR" -avd potato-ui -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect >"$RUNNER_TEMP/emulator.log" 2>&1 &
          EMU_PID=$!
          for i in $(seq 1 180); do
            kill -0 "$EMU_PID" 2>/dev/null || { cat "$RUNNER_TEMP/emulator.log"; exit 1; }
            SERIAL="$("$ADB" devices | awk '$2 == "device" && $1 ~ /^emulator-/ {print $1; exit}')"
            [ -n "$SERIAL" ] && break
            sleep 2
          done
          test -n "${SERIAL:-}"
          for i in $(seq 1 180); do
            [ "$("$ADB" -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 2
          done
          test "$("$ADB" -s "$SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = 1
          "$ADB" -s "$SERIAL" shell settings put system accelerometer_rotation 0 || true
          "$ADB" -s "$SERIAL" shell settings put system user_rotation 1 || true
          APK="$GITHUB_WORKSPACE/android/build/outputs/apk/debug/android-debug.apk"
          "$ADB" -s "$SERIAL" install -r "$APK" | tee "$RUNNER_TEMP/install.txt"
          grep -q Success "$RUNNER_TEMP/install.txt"
          "$ADB" -s "$SERIAL" shell am start -W -n com.potato.jarvis/.MainActivity | tee "$RUNNER_TEMP/start.txt"
          grep -q 'Status: ok' "$RUNNER_TEMP/start.txt"
          sleep 4
          dump_ui() {
            "$ADB" -s "$SERIAL" shell uiautomator dump /sdcard/window.xml >/dev/null
            "$ADB" -s "$SERIAL" pull /sdcard/window.xml "$RUNNER_TEMP/window.xml" >/dev/null
          }
          tap_text() {
            local needle="$1"
            dump_ui
            local xy
            xy=$(python - "$needle" "$RUNNER_TEMP/window.xml" <<'PY'
          import re, sys, xml.etree.ElementTree as ET
          needle=sys.argv[1].lower()
          root=ET.parse(sys.argv[2]).getroot()
          for node in root.iter('node'):
              hay=(node.attrib.get('text','')+' '+node.attrib.get('content-desc','')).lower()
              if needle in hay:
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', node.attrib.get('bounds',''))
                  if m:
                      a,b,c,d=map(int,m.groups())
                      print((a+c)//2, (b+d)//2)
                      raise SystemExit(0)
          raise SystemExit('UI text not found: '+needle)
          PY
            )
            "$ADB" -s "$SERIAL" shell input tap $xy
          }
          dump_ui
          if grep -q 'Optional Accessibility context' "$RUNNER_TEMP/window.xml"; then tap_text 'Accept'; sleep 2; fi
          dump_ui
          if grep -Eq 'Connect your AI assistant|Test &amp; Connect|Test & Connect' "$RUNNER_TEMP/window.xml"; then tap_text 'Test & Connect'; sleep 5; fi
          for i in $(seq 1 20); do
            dump_ui
            if grep -q 'Hey Cody' "$RUNNER_TEMP/window.xml" && grep -q 'Review project proposal' "$RUNNER_TEMP/window.xml"; then break; fi
            sleep 1
          done
          grep -q 'Hey Cody' "$RUNNER_TEMP/window.xml"
          grep -q 'Your tasks for today' "$RUNNER_TEMP/window.xml"
          grep -q 'Review project proposal' "$RUNNER_TEMP/window.xml"
          grep -q 'Work on POTATO V5.8 ideas' "$RUNNER_TEMP/window.xml"
          grep -q 'Ask POTATO anything' "$RUNNER_TEMP/window.xml"
          "$ADB" -s "$SERIAL" exec-out screencap -p > "$RUNNER_TEMP/POTATO-UI-reference.png"
          test -s "$RUNNER_TEMP/POTATO-UI-reference.png"
          cp "$RUNNER_TEMP/window.xml" "$RUNNER_TEMP/POTATO-UI-reference.xml"

      - name: Hash APK
        run: sha256sum android/build/outputs/apk/debug/android-debug.apk | tee "$RUNNER_TEMP/apk.sha256"

      - name: Upload UI proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: POTATO-UI-REFERENCE-PROOF
          path: |
            ${{ runner.temp }}/POTATO-UI-reference.png
            ${{ runner.temp }}/POTATO-UI-reference.xml
            ${{ runner.temp }}/health.json
            ${{ runner.temp }}/install.txt
            ${{ runner.temp }}/start.txt
            ${{ runner.temp }}/apk.sha256
            android/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Upload UI APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: POTATO-UI-REFERENCE-APK
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          compression-level: 0
