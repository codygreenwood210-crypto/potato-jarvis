name: Materialize POTATO V5.7 canonical source

on:
  push:
    branches: [verify-v5.7]
    paths:
      - '.github/workflows/materialize-v5.7-source.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    if: "!contains(github.event.head_commit.message, '[v57-canonical]')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Download authoritative V5.6 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v56-artifact" "$RUNNER_TEMP/v56-source"
          gh run download 34616638024 --repo "$GITHUB_REPOSITORY" -n POTATO-JARVIS-FINAL-V5.6 -D "$RUNNER_TEMP/v56-artifact"
          echo '0a1cca710c71644036a0879f5080859d37d449f716eb864f9a35096db8198ea6  '"$RUNNER_TEMP/v56-artifact/POTATO-JARVIS-FINAL-V5.6.zip" | sha256sum -c -
          unzip -t "$RUNNER_TEMP/v56-artifact/POTATO-JARVIS-FINAL-V5.6.zip" >/dev/null
          unzip -q "$RUNNER_TEMP/v56-artifact/POTATO-JARVIS-FINAL-V5.6.zip" -d "$RUNNER_TEMP/v56-source"
          test -d "$RUNNER_TEMP/v56-source/POTATO-JARVIS-V5.6"

      - name: Install canonical source at repository root
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/v56-source/POTATO-JARVIS-V5.6"
          for p in android backend docs gradle scripts .gitignore README.md HOW_TO_BUILD.md RELEASE_REPORT.md build.gradle.kts settings.gradle.kts gradle.properties gradlew gradlew.bat VERSION SOURCE_MANIFEST.sha256 CHANGES_V5.6.md; do
            if [ -e "$src/$p" ]; then
              rm -rf "$p"
              cp -a "$src/$p" "$p"
            fi
          done
          rm -rf .v57-bootstrap scripts/v56_patch scripts/v56_stage2 scripts/make_v56.py
          printf '5.7\n' > VERSION
          python - <<'PY'
          from pathlib import Path
          p=Path('android/build.gradle.kts')
          s=p.read_text()
          s=s.replace('versionCode = 56', 'versionCode = 57').replace('versionName = "5.6"', 'versionName = "5.7"')
          p.write_text(s)
          PY
          test "$(cat VERSION)" = 5.7
          grep -F 'versionCode = 57' android/build.gradle.kts
          grep -F 'versionName = "5.7"' android/build.gradle.kts

      - name: Commit direct-source V5.7 baseline
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m '[v57-canonical] Materialize verified V5.6 source as direct V5.7 baseline'
          git push origin HEAD:verify-v5.7
