name: Verify POTATO V5.6

on:
  push:
    branches: [verify-v5.6]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: potato-v5.6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      V55_RUN_ID: '34605276632'
      V55_SOURCE_SHA256: '0f78572887384f96f598c2b2c7492aba24f94b23d07f7688f86da7a84ea1d317'
    steps:
      - name: Checkout V5.6 verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Download exact successful V5.5 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v55-input" "$RUNNER_TEMP/v55-extracted"
          gh run download "$V55_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            -n POTATO-JARVIS-FINAL-V5.5 \
            -D "$RUNNER_TEMP/v55-input"
          echo "$V55_SOURCE_SHA256  $RUNNER_TEMP/v55-input/POTATO-JARVIS-FINAL-V5.5.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/v55-input/POTATO-JARVIS-FINAL-V5.5.zip" -d "$RUNNER_TEMP/v55-extracted"
          test -d "$RUNNER_TEMP/v55-extracted/POTATO-JARVIS-V5.5"

      - name: Reconstruct exact V5.6 source
        run: |
          set -euo pipefail
          python scripts/make_v56.py "$RUNNER_TEMP/v55-extracted/POTATO-JARVIS-V5.5"
          echo "PROJECT=$RUNNER_TEMP/v55-extracted/POTATO-JARVIS-V5.6" >> "$GITHUB_ENV"

      - name: Verify V5.6 source state
        run: |
          set -euo pipefail
          cd "$PROJECT"
          test "$(cat VERSION)" = "5.6"
          grep -F 'compileSdk = 36' android/build.gradle.kts
          grep -F 'targetSdk = 36' android/build.gradle.kts
          grep -F 'versionCode = 56' android/build.gradle.kts
          grep -F 'versionName = "5.6"' android/build.gradle.kts
          grep -F 'AccessibilityConsent.isAccepted' android/src/main/java/com/potato/jarvis/accessibility/PotatoAccessibilityService.kt
          grep -F 'foregroundPackage = foregroundPackage()' android/src/main/java/com/potato/jarvis/device/DeviceContext.kt
          grep -F 'class DeepLinkRouterTest' android/src/test/java/com/potato/jarvis/DeepLinkRouterTest.kt
          grep -F 'class SecurityGatewayTest' android/src/test/java/com/potato/jarvis/SecurityGatewayTest.kt
          ! grep -F 'android.permission.CAMERA' android/src/main/AndroidManifest.xml
          test ! -f .github/workflows/build-matrix.yml
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('.')
          xml_files = sorted(root.glob('android/src/**/*.xml'))
          for path in xml_files:
              ET.parse(path)
          print(f'ANDROID_XML_PARSE=PASS files={len(xml_files)}')
          banned = {'.gradle', '.kotlin', '.pytest_cache', '__pycache__'}
          bad = [str(p) for p in root.rglob('*') if p.is_dir() and (p.name in banned or p.name == 'build')]
          if bad:
              raise SystemExit('Generated directories survived V5.6 reconstruction: ' + ', '.join(bad[:20]))
          print('GENERATED_OUTPUT_CLEAN=PASS')
          PY

      - name: Verify Gradle wrapper integrity
        run: |
          set -euo pipefail
          cd "$PROJECT"
          chmod +x gradlew scripts/*.sh backend/run.sh
          ./scripts/verify_gradle_wrapper.sh

      - name: Backend dependencies
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Backend compile and tests
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python -m compileall -q backend
          python -m pytest -q backend/tests

      - name: Android unit tests
        run: |
          set -euo pipefail
          cd "$PROJECT"
          ./gradlew :android:testDebugUnitTest --no-daemon --stacktrace

      - name: Require real Android tests
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path('android/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          tests = 0
          failures = 0
          errors = 0
          for path in reports:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', '0'))
              failures += int(root.attrib.get('failures', '0'))
              errors += int(root.attrib.get('errors', '0'))
          if tests <= 0:
              raise SystemExit('Android test task produced zero actual tests')
          if failures or errors:
              raise SystemExit(f'Android tests not clean: tests={tests} failures={failures} errors={errors}')
          print(f'ANDROID_TESTS_EXECUTED={tests}')
          PY

      - name: Android resources
        run: |
          set -euo pipefail
          cd "$PROJECT"
          ./gradlew :android:processDebugResources --no-daemon --stacktrace

      - name: Android assembleDebug
        run: |
          set -euo pipefail
          cd "$PROJECT"
          ./gradlew :android:assembleDebug --no-daemon --stacktrace

      - name: Android lint
        run: |
          set -euo pipefail
          cd "$PROJECT"
          ./gradlew :android:lint --no-daemon --max-workers=1 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' --stacktrace

      - name: Build release Android App Bundle
        run: |
          set -euo pipefail
          cd "$PROJECT"
          ./gradlew :android:bundleRelease --no-daemon --stacktrace

      - name: Package and validate clean V5.6 source
        run: |
          set -euo pipefail
          cd "$PROJECT"
          python scripts/package_clean_source.py "$RUNNER_TEMP/POTATO-JARVIS-FINAL-V5.6.zip" | tee "$RUNNER_TEMP/source-package.txt"
          unzip -t "$RUNNER_TEMP/POTATO-JARVIS-FINAL-V5.6.zip"
          python - <<'PY'
          from zipfile import ZipFile
          import os
          path = os.path.join(os.environ['RUNNER_TEMP'], 'POTATO-JARVIS-FINAL-V5.6.zip')
          with ZipFile(path) as z:
              names = z.namelist()
              roots = {n.split('/', 1)[0] for n in names if n}
              if roots != {'POTATO-JARVIS-V5.6'}:
                  raise SystemExit(f'Bad source archive root: {roots}')
              bad = [n for n in names if '/build/' in n or '/.gradle/' in n or '/.kotlin/' in n or '__pycache__' in n or n.endswith(('.apk','.aab','.pyc'))]
              if bad:
                  raise SystemExit('Generated output leaked into source ZIP: ' + ', '.join(bad[:20]))
              print(f'CLEAN_SOURCE_ARCHIVE=PASS files={len(names)}')
          PY

      - name: Artifact hashes
        run: |
          set -euo pipefail
          cd "$PROJECT"
          sha256sum android/build/outputs/apk/debug/*.apk | tee "$RUNNER_TEMP/apk.sha256"
          sha256sum android/build/outputs/bundle/release/*.aab | tee "$RUNNER_TEMP/aab.sha256"
          sha256sum "$RUNNER_TEMP/POTATO-JARVIS-FINAL-V5.6.zip" | tee "$RUNNER_TEMP/source.sha256"

      - name: Upload V5.6 debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potato-v5.6-debug-apk
          path: ${{ env.PROJECT }}/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload V5.6 release AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potato-v5.6-release-aab-unsigned
          path: ${{ env.PROJECT }}/android/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload complete clean V5.6 source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: POTATO-JARVIS-FINAL-V5.6
          path: ${{ runner.temp }}/POTATO-JARVIS-FINAL-V5.6.zip
          if-no-files-found: error

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: potato-v5.6-verification-reports
          path: |
            ${{ env.PROJECT }}/android/build/reports/tests/
            ${{ env.PROJECT }}/android/build/reports/lint-results-debug.html
            ${{ env.PROJECT }}/android/build/reports/lint-results-debug.xml
            ${{ runner.temp }}/*.sha256
            ${{ runner.temp }}/source-package.txt
          if-no-files-found: warn
