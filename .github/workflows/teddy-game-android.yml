name: Teddy Game Android Vertical Slice CI

on:
  push:
    branches: [teddy-game-v0.1-native-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Teddy drawable resources
        run: |
          set -euxo pipefail
          mkdir -p teddy-game/app/src/main/res/drawable-nodpi
          if unzip -tq teddy-drawables.zip >/dev/null 2>&1; then
            unzip -oq teddy-drawables.zip -d teddy-game/app/src/main/res
            echo "Using packaged Teddy v1.1 drawable selection" | tee teddy-game/resource-source.txt
          else
            echo "Staged binary archive invalid; generating deterministic build-safe pixel-art fallbacks" | tee teddy-game/resource-source.txt
            python3 - <<'PY'
          import pathlib, struct, zlib

          out = pathlib.Path("teddy-game/app/src/main/res/drawable-nodpi")
          out.mkdir(parents=True, exist_ok=True)

          def chunk(tag, data):
              return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xffffffff)

          def png(path, w, h, kind):
              rows = []
              for y in range(h):
                  row = bytearray([0])
                  for x in range(w):
                      # Pixel-art-friendly generated fallbacks. They exist only when the
                      # selected production sprite archive cannot be decoded in CI.
                      if kind == "hero":
                          c = (231, 177, 72, 255) if x < w // 2 else (109, 61, 156, 255)
                          if abs(x - w // 2) <= max(1, w // 32): c = (177, 49, 61, 255)
                          if y < h // 5 and (x // 8) % 2 == 0: c = (151, 45, 73, 255)
                      elif kind == "boss":
                          c = (194, 85, 28, 255) if (x // 8 + y // 8) % 2 == 0 else (92, 35, 74, 255)
                          if h // 3 < y < h // 2 and (w // 4 < x < w // 3 or 2*w//3 < x < 3*w//4): c = (241, 215, 72, 255)
                      elif kind == "enemy":
                          c = (88, 145, 91, 255) if (x // 8 + y // 8) % 2 == 0 else (70, 53, 105, 255)
                      elif kind == "npc":
                          c = (144, 177, 188, 255) if (x // 8 + y // 8) % 2 == 0 else (92, 56, 120, 255)
                      elif kind == "village":
                          c = (40, 29, 61, 255) if y < h * 2 // 3 else (47, 43, 52, 255)
                          if (x // 32) % 3 == 1 and h//2 < y < h*3//4: c = (217, 119, 49, 255)
                      elif kind == "forest":
                          c = (24, 45, 48, 255) if y < h * 2 // 3 else (35, 62, 48, 255)
                          if (x // 24) % 3 == 0: c = (52, 39, 70, 255)
                      else:
                          c = (139, 86, 55, 255) if (x // 8 + y // 8) % 2 == 0 else (92, 58, 78, 255)
                      row.extend(c)
                  rows.append(bytes(row))
              raw = b"".join(rows)
              data = (b"\x89PNG\r\n\x1a\n" +
                      chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) +
                      chunk(b"IDAT", zlib.compress(raw, 9)) +
                      chunk(b"IEND", b""))
              path.write_bytes(data)

          hero = ["hero_attack","hero_fall","hero_golden","hero_heal","hero_idle","hero_jump","hero_nightmare","hero_run_1","hero_run_2"]
          enemies = ["enemy_goblin","enemy_living_pumpkin","enemy_slime"]
          npcs = ["npc_ghost_child","npc_skeleton_blacksmith","npc_vampire_merchant","npc_witch_guide"]
          props = ["interactable_checkpoint","item_heart_shard","prop_magic_lamp","prop_pumpkin","prop_quest_board","tile_bridge","tile_grass"]
          for n in hero: png(out / f"{n}.png", 96, 96, "hero")
          for n in enemies: png(out / f"{n}.png", 64, 64, "enemy")
          for n in npcs: png(out / f"{n}.png", 80, 80, "npc")
          for n in props: png(out / f"{n}.png", 48, 48, "prop")
          png(out / "boss_pumpkin_king.png", 128, 128, "boss")
          png(out / "bg_village.png", 640, 360, "village")
          png(out / "bg_forest.png", 640, 360, "forest")
          PY
          fi
          test -f teddy-game/app/src/main/res/drawable-nodpi/hero_idle.png
          test -f teddy-game/app/src/main/res/drawable-nodpi/boss_pumpkin_king.png
          test -f teddy-game/app/src/main/res/drawable-nodpi/bg_forest.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Pure Java regression gate
        run: |
          mkdir -p teddy-game/build/selftest
          javac -Xlint:all -d teddy-game/build/selftest \
            teddy-game/app/src/main/java/com/potatopixelartstudios/teddygame/GameState.java \
            teddy-game/ci/GameStateSelfTest.java
          java -cp teddy-game/build/selftest GameStateSelfTest

      - name: Unit tests, lint, APK and AAB
        working-directory: teddy-game
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug bundleDebug

      - name: Emulator smoke and lifecycle test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euxo pipefail
            adb logcat -c
            adb install -r teddy-game/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.potatopixelartstudios.teddygame/.MainActivity | tee teddy-game/emulator-start.txt
            sleep 3
            adb shell pidof com.potatopixelartstudios.teddygame | tee teddy-game/emulator-pid.txt
            adb exec-out screencap -p > teddy-game/emulator-title.png
            # Exercise title -> intro -> gameplay through touch input.
            SIZE=$(adb shell wm size | tail -1 | tr -d '\r')
            echo "$SIZE" | tee teddy-game/emulator-size.txt
            adb shell input tap 960 810 || true
            sleep 1
            adb shell input tap 960 830 || true
            sleep 2
            adb exec-out screencap -p > teddy-game/emulator-gameplay.png
            # Background/foreground lifecycle smoke.
            adb shell input keyevent KEYCODE_HOME
            sleep 1
            adb shell am start -W -n com.potatopixelartstudios.teddygame/.MainActivity | tee teddy-game/emulator-resume.txt
            sleep 2
            adb shell pidof com.potatopixelartstudios.teddygame
            adb logcat -d > teddy-game/emulator-logcat.txt
            ! grep -q 'FATAL EXCEPTION' teddy-game/emulator-logcat.txt
            test -s teddy-game/emulator-title.png
            test -s teddy-game/emulator-gameplay.png

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teddy-game-v0.1-verification
          if-no-files-found: warn
          path: |
            teddy-game/app/build/outputs/apk/debug/app-debug.apk
            teddy-game/app/build/outputs/bundle/debug/app-debug.aab
            teddy-game/app/build/reports/tests/testDebugUnitTest/
            teddy-game/app/build/reports/lint-results-debug.html
            teddy-game/resource-source.txt
            teddy-game/emulator-start.txt
            teddy-game/emulator-resume.txt
            teddy-game/emulator-pid.txt
            teddy-game/emulator-size.txt
            teddy-game/emulator-title.png
            teddy-game/emulator-gameplay.png
            teddy-game/emulator-logcat.txt
