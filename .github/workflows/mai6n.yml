name: Auto-fix and build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/lg

          unzip -q "$(ls *.zip | head -1)" -d src
          ROOT=$(dirname "$(find src -name settings.gradle.kts -print -quit)")
          echo "Project root: $ROOT"
          cd "$ROOT"
          chmod +x gradlew scripts/*.sh backend/run.sh

          SDK=35
          AGP=8.7.3
          ATTEMPT=0
          echo "| # | lifecycle | compileSdk | AGP | result |" > /tmp/report.md
          echo "|---|---|---|---|---|" >> /tmp/report.md

          for LC in 2.10.0 2.9.4 2.9.2 2.9.0; do
            for RETRY in 1 2; do
              ATTEMPT=$((ATTEMPT+1))
              LOG=/tmp/lg/attempt-$ATTEMPT.log
              echo "########## attempt $ATTEMPT : lifecycle=$LC compileSdk=$SDK agp=$AGP ##########"

              sed -i "s|\(androidx\.lifecycle:[a-z-]*\):[^\"]*|\1:$LC|g" android/build.gradle.kts
              sed -i "s|^\( *\)compileSdk = .*|\1compileSdk = $SDK|" android/build.gradle.kts
              sed -i "s|^\( *\)targetSdk = .*|\1targetSdk = $SDK|" android/build.gradle.kts
              sed -i "s|id(\"com.android.application\") version \"[^\"]*\"|id(\"com.android.application\") version \"$AGP\"|" build.gradle.kts
              grep -n 'lifecycle\|compileSdk' android/build.gradle.kts

              ./gradlew :android:assembleDebug --no-daemon 2>&1 | tee "$LOG" | tail -20
              RC=${PIPESTATUS[0]}

              if [ "$RC" = "0" ]; then
                echo "| $ATTEMPT | $LC | $SDK | $AGP | **SUCCESS** |" >> /tmp/report.md
                cp /tmp/report.md $GITHUB_STEP_SUMMARY
                echo "BUILT with lifecycle=$LC compileSdk=$SDK agp=$AGP"
                exit 0
              fi

              REASON=$(grep -E 'Could not find|requires |^e: |error:' "$LOG" | head -1 | cut -c1-80)
              echo "| $ATTEMPT | $LC | $SDK | $AGP | ${REASON:-see log} |" >> /tmp/report.md

              NEED_SDK=$(grep -oE 'compile against version [0-9]+' "$LOG" | grep -oE '[0-9]+' | sort -n | tail -1)
              NEED_AGP=$(grep -oE 'requires Android Gradle plugin [0-9]+\.[0-9]+\.[0-9]+' "$LOG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
              CHANGED=0
              if [ -n "${NEED_SDK:-}" ] && [ "$NEED_SDK" != "$SDK" ]; then SDK=$NEED_SDK; CHANGED=1; fi
              if [ -n "${NEED_AGP:-}" ] && [ "$NEED_AGP" != "$AGP" ]; then AGP=$NEED_AGP; CHANGED=1; fi
              [ "$CHANGED" = "0" ] && break
              echo ">>> retrying with compileSdk=$SDK agp=$AGP"
            done
          done

          cp /tmp/report.md $GITHUB_STEP_SUMMARY
          echo "########## EVERY ERROR FROM EVERY ATTEMPT ##########"
          cat /tmp/lg/attempt-*.log | grep -E 'Could not find|requires |Unresolved reference|^e: |error:' | sort -u | head -60
          echo "########## FULL TEXT OF LAST FAILURE ##########"
          sed -n '/FAILURE:/,$p' "$LOG" | head -80
          exit 1

      - name: Report
        if: always()
        shell: bash
        run: cat /tmp/report.md 2>/dev/null || echo "none"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/lg/
          if-no-files-found: warn

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: potato-debug-apk
          path: src/**/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
