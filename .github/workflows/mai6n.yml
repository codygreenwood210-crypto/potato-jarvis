name: POTATO V5.2 device-safe APK build

on:
  push:
    branches:
      - nova-v5-2-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct exact V5.2 Android source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src
          mkdir src
          unzip -q POTATO-JARVIS-V5.1-BUILDABLE.zip -d src
          ROOT="$(dirname "$(find src -name settings.gradle.kts -print -quit)")"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          cd "$ROOT"
          python "$GITHUB_WORKSPACE/v5.2-materialize/00-core.py"
          python "$GITHUB_WORKSPACE/v5.2-materialize/01-mainactivity.py"
          python "$GITHUB_WORKSPACE/v5.2-materialize/02-viewmodel.py"

          # Device-install safety fix: the AccessibilityService entry was only
          # reserved scaffolding and performed no cross-app control. Do not
          # declare a dormant accessibility service in the sideloaded APK.
          cp "$GITHUB_WORKSPACE/v5.2-materialize/AndroidManifest.device-safe.xml" android/src/main/AndroidManifest.xml

          chmod +x gradlew scripts/*.sh backend/run.sh
          echo "Project root: $ROOT"
          echo "Version: $(cat VERSION)"
          grep -n 'versionCode\|versionName\|lifecycle\|compileOptions' android/build.gradle.kts
          echo '=== source manifest security check ==='
          if grep -nE 'BIND_ACCESSIBILITY_SERVICE|PotatoAccessibilityService|android\.accessibilityservice\.AccessibilityService' android/src/main/AndroidManifest.xml; then
            echo 'Unexpected accessibility service declaration remains in installable source manifest' >&2
            exit 1
          fi
          grep -n 'uses-permission\|provider\|activity' android/src/main/AndroidManifest.xml

      - name: Baseline backend regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
          python -m pytest -q backend/tests | tee "$GITHUB_WORKSPACE/backend-tests.log"

      - name: Build Android debug APK with full Gradle evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          ./gradlew :android:assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee "$GITHUB_WORKSPACE/gradle-full.log"

      - name: Verify actual merged manifests contain no AccessibilityService declaration
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          mapfile -t MANIFESTS < <(find android/build/intermediates -type f -name AndroidManifest.xml \( -path '*merged_manifest*' -o -path '*merged_manifests*' -o -path '*packaged_manifests*' \) -print)
          if [ "${#MANIFESTS[@]}" -eq 0 ]; then
            echo 'No merged AndroidManifest.xml files found; refusing to claim verification.' >&2
            exit 1
          fi
          printf 'Verifying merged manifest: %s\n' "${MANIFESTS[@]}"
          for manifest in "${MANIFESTS[@]}"; do
            if grep -nE 'BIND_ACCESSIBILITY_SERVICE|PotatoAccessibilityService|android\.accessibilityservice\.AccessibilityService' "$manifest"; then
              echo "AccessibilityService declaration found in $manifest" >&2
              exit 1
            fi
          done
          echo 'Merged manifest verification passed: no AccessibilityService declaration.'

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5-2-device-safe-debug-apk
          path: src/**/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload complete verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5-2-device-safe-verification-logs
          path: |
            gradle-full.log
            backend-tests.log
          if-no-files-found: warn
