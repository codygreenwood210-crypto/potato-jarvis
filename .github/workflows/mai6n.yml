name: POTATO V5.2 deterministic APK build

on:
  push:
    branches:
      - nova-v5-2-apk-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct clean build tree and apply verified V5.2 build fixes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src
          mkdir src
          unzip -q POTATO-JARVIS-V5.1-BUILDABLE.zip -d src

          ROOT="$(dirname "$(find src -name settings.gradle.kts -print -quit)")"
          test -n "$ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

          cd "$ROOT"
          chmod +x gradlew scripts/*.sh backend/run.sh

          # Verified dependency repair: lifecycle 2.9.7 does not exist; use 2.10.0.
          sed -i 's|lifecycle-viewmodel-compose:[^"]*|lifecycle-viewmodel-compose:2.10.0|' android/build.gradle.kts
          sed -i 's|lifecycle-runtime-compose:[^"]*|lifecycle-runtime-compose:2.10.0|' android/build.gradle.kts

          # Remove the conflicting debug manifest cleartext declaration.
          cat > android/src/debug/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application />
          </manifest>
          EOF

          # Use source-set Network Security Config so release stays HTTPS-only
          # while the debug build can reach the local development backend.
          mkdir -p android/src/main/res/xml android/src/debug/res/xml
          cat > android/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          cat > android/src/debug/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('android/src/main/AndroidManifest.xml')
          text = p.read_text()
          if 'android:networkSecurityConfig=' not in text:
              marker = 'android:usesCleartextTraffic="false"'
              if marker not in text:
                  raise SystemExit('Expected usesCleartextTraffic=false marker not found')
              text = text.replace(marker, marker + '\n        android:networkSecurityConfig="@xml/network_security_config"', 1)
          p.write_text(text)
          PY

          echo '=== lifecycle dependencies ==='
          grep -n 'lifecycle' android/build.gradle.kts
          echo '=== main application network settings ==='
          grep -n 'usesCleartextTraffic\|networkSecurityConfig' android/src/main/AndroidManifest.xml
          echo '=== debug manifest ==='
          cat android/src/debug/AndroidManifest.xml

      - name: Backend regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
          python -m pytest -q backend/tests | tee "$GITHUB_WORKSPACE/backend-tests.log"

      - name: Build Android debug APK with full Gradle evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          ./gradlew :android:assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee "$GITHUB_WORKSPACE/gradle-full.log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5-2-debug-apk
          path: src/**/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload complete verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5-2-verification-logs
          path: |
            gradle-full.log
            backend-tests.log
          if-no-files-found: warn
