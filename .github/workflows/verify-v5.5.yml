name: Verify POTATO V5.5

on:
  push:
    branches: [verify-v5.1]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download verified V5.4 source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf input build-src
          mkdir -p input build-src
          gh run download 34468722357 -n POTATO-JARVIS-FINAL-V5.4 -D input
          test -s input/POTATO-JARVIS-FINAL-V5.4.zip
          unzip -q input/POTATO-JARVIS-FINAL-V5.4.zip -d build-src
          test -d build-src/POTATO-JARVIS-V5.4
          mv build-src/POTATO-JARVIS-V5.4 build-src/POTATO-JARVIS-V5.5
          echo "PROJECT_ROOT=build-src/POTATO-JARVIS-V5.5" >> "$GITHUB_ENV"

      - name: Fetch official Gradle 8.13 integrity metadata
        shell: bash
        run: |
          set -euo pipefail
          DIST_SHA="$(curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip.sha256 | tr -d '[:space:]')"
          JAR_SHA="$(curl -fsSL https://services.gradle.org/distributions/gradle-8.13-wrapper.jar.sha256 | tr -d '[:space:]')"
          test "${#DIST_SHA}" -eq 64
          test "${#JAR_SHA}" -eq 64
          echo "GRADLE_813_DIST_SHA=$DIST_SHA" >> "$GITHUB_ENV"
          echo "GRADLE_813_JAR_SHA=$JAR_SHA" >> "$GITHUB_ENV"

      - name: Create V5.5 source with official Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          python scripts/make_v55.py
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle-8.13-bin.zip
          echo "$GRADLE_813_DIST_SHA  /tmp/gradle-8.13-bin.zip" | sha256sum -c -
          rm -rf /tmp/gradle-8.13
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp
          /tmp/gradle-8.13/bin/gradle -p "$PROJECT_ROOT" wrapper --gradle-version 8.13 --distribution-type bin --no-daemon
          test -s "$PROJECT_ROOT/gradle/wrapper/gradle-wrapper.jar"
          echo "$GRADLE_813_JAR_SHA  $PROJECT_ROOT/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          chmod +x "$PROJECT_ROOT/gradlew" "$PROJECT_ROOT/scripts/verify_gradle_wrapper.sh"

      - name: Verify V5.5 source state
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          test "$(tr -d '\r\n' < VERSION)" = "5.5"
          grep -q 'compileSdk = 36' android/build.gradle.kts
          grep -q 'targetSdk = 36' android/build.gradle.kts
          grep -q 'versionCode = 55' android/build.gradle.kts
          grep -q 'versionName = "5.5"' android/build.gradle.kts
          grep -q 'VERSION = "5.5"' backend/main.py
          grep -q 'com.android.application") version "8.12.2"' build.gradle.kts
          grep -q 'gradle-8.13-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -q 'android:isAccessibilityTool="false"' android/src/main/res/xml/accessibility_service_config.xml
          grep -q 'canRetrieveWindowContent="false"' android/src/main/res/xml/accessibility_service_config.xml
          grep -q 'Optional Accessibility context' android/src/main/java/com/potato/jarvis/MainActivity.kt
          grep -q 'Text("Accept")' android/src/main/java/com/potato/jarvis/MainActivity.kt
          grep -q 'Text("Decline")' android/src/main/java/com/potato/jarvis/MainActivity.kt
          grep -q 'foreground_package' android/src/main/java/com/potato/jarvis/accessibility/PotatoAccessibilityService.kt
          ! grep -q '^android.experimental.lint.version=' gradle.properties
          test -s docs/PLAY_CONSOLE_ACCESSIBILITY_DECLARATION_V5.5.md
          test -s docs/RELEASE_READINESS_V5.5.md
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Backend dependencies
        run: python -m pip install -r "$PROJECT_ROOT/backend/requirements.txt"

      - name: Backend compile and tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python -m compileall -q backend
          python -m pytest -q backend/tests

      - name: Verify Gradle wrapper integrity
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          chmod +x gradlew scripts/*.sh backend/run.sh
          ./scripts/verify_gradle_wrapper.sh

      - name: Verify Android resources
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew :android:processDebugResources --no-daemon

      - name: Android assembleDebug
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew :android:assembleDebug --no-daemon
          test -s android/build/outputs/apk/debug/android-debug.apk
          sha256sum android/build/outputs/apk/debug/android-debug.apk

      - name: Android lint
        shell: bash
        env:
          LINT_PRINT_STACKTRACE: 'true'
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew :android:lint --no-daemon

      - name: Build release Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew :android:bundleRelease --no-daemon
          test -s android/build/outputs/bundle/release/android-release.aab
          sha256sum android/build/outputs/bundle/release/android-release.aab

      - name: Package complete V5.5 source
        shell: bash
        run: |
          set -euo pipefail
          cd build-src
          zip -qr POTATO-JARVIS-FINAL-V5.5.zip POTATO-JARVIS-V5.5
          sha256sum POTATO-JARVIS-FINAL-V5.5.zip

      - name: Upload V5.5 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5.5-debug-apk
          path: ${{ env.PROJECT_ROOT }}/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload V5.5 release AAB
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5.5-release-aab-unsigned
          path: ${{ env.PROJECT_ROOT }}/android/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload complete V5.5 source
        uses: actions/upload-artifact@v4
        with:
          name: POTATO-JARVIS-FINAL-V5.5
          path: build-src/POTATO-JARVIS-FINAL-V5.5.zip
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5.5-lint-reports
          path: |
            ${{ env.PROJECT_ROOT }}/android/build/reports/
            ${{ env.PROJECT_ROOT }}/android/build/intermediates/lint*/
          if-no-files-found: ignore
