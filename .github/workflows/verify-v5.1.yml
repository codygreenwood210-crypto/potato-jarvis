name: Verify POTATO V5.1

on:
  push:
    branches:
      - verify-v5.1
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Extract V5.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src
          mkdir build-src
          unzip -q POTATO-JARVIS-V5.1-BUILDABLE.zip -d build-src
          ROOT="$(dirname "$(find build-src -name settings.gradle.kts -print -quit)")"
          test -n "$ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Verify source version
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          test "$(tr -d '\r\n' < VERSION)" = "5.1"
          grep -q 'versionCode = 51' android/build.gradle.kts
          grep -q 'versionName = "5.1"' android/build.gradle.kts
          grep -q 'VERSION = "5.1"' backend/main.py

      - name: Backend dependencies
        shell: bash
        run: python -m pip install -r "$PROJECT_ROOT/backend/requirements.txt"

      - name: Backend compile and tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          python -m compileall -q backend
          python -m pytest -q backend/tests

      - name: Verify Gradle bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          chmod +x gradlew scripts/*.sh backend/run.sh
          ./scripts/verify_gradle_wrapper.sh

      - name: Android compile and lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          ./gradlew :android:assembleDebug :android:lint --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5.1-debug-apk
          path: ${{ env.PROJECT_ROOT }}/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: potato-v5.1-lint-reports
          path: |
            ${{ env.PROJECT_ROOT }}/android/build/reports/
            ${{ env.PROJECT_ROOT }}/android/build/intermediates/lint*/
          if-no-files-found: ignore
