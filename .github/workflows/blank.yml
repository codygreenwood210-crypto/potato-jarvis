name: Unpack and build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current
            agp: "8.7.3"
            sdk: "35"
          - name: modern
            agp: "8.9.1"
            sdk: "36"
    name: ${{ matrix.name }} (AGP ${{ matrix.agp }} / SDK ${{ matrix.sdk }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack the archive
        run: |
          set -eu
          ZIP=$(ls *.zip | head -1)
          echo "Using archive: $ZIP"
          unzip -q "$ZIP" -d src
          ROOT=$(dirname "$(find src -name settings.gradle.kts -print -quit)")
          echo "Project root: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV
          ls "$ROOT"

      - name: Apply toolchain configuration
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          chmod +x gradlew scripts/*.sh backend/run.sh
          sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "${{ matrix.agp }}"/' build.gradle.kts
          sed -i 's/^\( *\)compileSdk = .*/\1compileSdk = ${{ matrix.sdk }}/' android/build.gradle.kts
          sed -i 's/^\( *\)targetSdk = .*/\1targetSdk = ${{ matrix.sdk }}/' android/build.gradle.kts
          grep -nE 'compileSdk|targetSdk|minSdk' android/build.gradle.kts

      - name: Assemble debug APK
        id: build
        continue-on-error: true
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail
          ./gradlew :android:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show errors
        if: steps.build.outcome == 'failure'
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "### ${{ matrix.name }} failed" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E 'requires .*(compile against|Android Gradle plugin)|minCompileSdk|Unresolved reference|Could not (find|resolve)|error:' build.log | head -40 >> $GITHUB_STEP_SUMMARY || tail -40 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Record success
        if: steps.build.outcome == 'success'
        run: echo "### ${{ matrix.name }} BUILT OK" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: ${{ env.PROJECT_ROOT }}/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.name }}
          path: ${{ env.PROJECT_ROOT }}/build.log
          if-no-files-found: warn
