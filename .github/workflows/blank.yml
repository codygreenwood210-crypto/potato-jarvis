name: Unpack and build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lc292
            lifecycle: "2.9.2"
            agp: "8.7.3"
            sdk: "35"
          - name: lc294
            lifecycle: "2.9.4"
            agp: "8.7.3"
            sdk: "35"
          - name: lc2100
            lifecycle: "2.10.0"
            agp: "8.9.1"
            sdk: "36"
    name: lifecycle ${{ matrix.lifecycle }} (AGP ${{ matrix.agp }} / SDK ${{ matrix.sdk }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack the archive
        run: |
          set -eu
          ZIP=$(ls *.zip | head -1)
          unzip -q "$ZIP" -d src
          ROOT=$(dirname "$(find src -name settings.gradle.kts -print -quit)")
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV

      - name: Patch versions
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          chmod +x gradlew scripts/*.sh backend/run.sh
          sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "${{ matrix.agp }}"/' build.gradle.kts
          sed -i 's/^\( *\)compileSdk = .*/\1compileSdk = ${{ matrix.sdk }}/' android/build.gradle.kts
          sed -i 's/^\( *\)targetSdk = .*/\1targetSdk = ${{ matrix.sdk }}/' android/build.gradle.kts
          sed -i 's/\(androidx\.lifecycle:[a-z-]*\):2\.9\.7/\1:${{ matrix.lifecycle }}/g' android/build.gradle.kts
          echo "Patched dependency lines:"
          grep -n 'lifecycle' android/build.gradle.kts

      - name: Assemble debug APK
        id: build
        continue-on-error: true
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -o pipefail
          ./gradlew :android:assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Errors
        if: steps.build.outcome == 'failure'
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "===== FAILED: lifecycle ${{ matrix.lifecycle }} ====="
          grep -E 'Could not find|requires .*(compile against|Android Gradle plugin)|Unresolved reference|e: |error:' build.log | sort -u | head -30
          echo "===== end ====="

      - name: Success
        if: steps.build.outcome == 'success'
        run: echo "### WORKS -> lifecycle ${{ matrix.lifecycle }}, AGP ${{ matrix.agp }}, SDK ${{ matrix.sdk }}" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: ${{ env.PROJECT_ROOT }}/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
