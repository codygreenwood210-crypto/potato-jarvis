plugins {
    id 'com.android.application'
}

android {
    namespace 'com.potatopixelartstudios.teddygame'
    compileSdk 36

    defaultConfig {
        applicationId 'com.potatopixelartstudios.teddygame'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
